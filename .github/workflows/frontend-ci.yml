name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "satiety-ai-workspace-frontend/**"

  pull_request:
    branches:
      - main
    paths:
      - "satiety-ai-workspace-frontend/**"

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: satiety-ai-workspace-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: satiety-ai-workspace-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build