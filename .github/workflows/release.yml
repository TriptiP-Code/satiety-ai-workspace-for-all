name: Release Images

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: self-hosted

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      ########################
      ## FRONTEND
      ########################

      - name: Build Frontend
        run: |
          docker build `
          -t ${{ secrets.DOCKER_USERNAME }}/satiety-frontend:${{ env.VERSION }} `
          ./satiety-ai-workspace-frontend

      - name: Push Frontend
        run: |
          docker push `
          ${{ secrets.DOCKER_USERNAME }}/satiety-frontend:${{ env.VERSION }}

      ########################
      ## BACKEND
      ########################

      - name: Build Backend
        run: |
          docker build `
          -t ${{ secrets.DOCKER_USERNAME }}/satiety-backend:${{ env.VERSION }} `
          ./satiety-ai-workspace-backend

      - name: Push Backend
        run: |
          docker push `
          ${{ secrets.DOCKER_USERNAME }}/satiety-backend:${{ env.VERSION }}

      - name: Release Summary
        run: |
          echo "Released Version:"
          echo "${{ env.VERSION }}"