name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "satiety-ai-workspace-backend/**"

  pull_request:
    branches:
      - main
    paths:
      - "satiety-ai-workspace-backend/**"

jobs:
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: satiety-ai-workspace-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: satiety-ai-workspace-backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Backend
        run: npm run build