name: Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  docker-build-push:
    runs-on: self-hosted
    # This self-hosted runner is Windows and has PowerShell scripts disabled.
    # Use cmd.exe for `run` steps so Actions does not dot-source its generated
    # PowerShell wrapper script.
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/satiety-frontend:latest ./satiety-ai-workspace-frontend

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/satiety-frontend:latest

      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/satiety-backend:latest ./satiety-ai-workspace-backend

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/satiety-backend:latest

      - name: Restart Frontend Deployment
        run: kubectl rollout restart deployment/satiety-frontend

      - name: Restart Backend Deployment
        run: kubectl rollout restart deployment/satiety-backend

      - name: Wait for Frontend
        run: kubectl rollout status deployment/satiety-frontend

      - name: Wait for Backend
        run: kubectl rollout status deployment/satiety-backend
