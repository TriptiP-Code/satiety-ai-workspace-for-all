apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: satiety-backend-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: satiety-backend

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: http
      path: /metrics
      interval: 15s