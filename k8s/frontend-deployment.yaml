apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 799675180298.dkr.ecr.us-east-1.amazonaws.com/satiety-ai-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80